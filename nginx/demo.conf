# Confluence Demo site configuration - Production (HTTPS)

upstream queue_manager {
    server queue-manager:3000;
}

upstream terminal {
    server queue-manager:7681;
}

upstream grafana {
    server lgtm:3000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # SSL configuration (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/demo.confluence-skills.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.confluence-skills.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/conf.d/locations.include;
}
